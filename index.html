<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>學科知識大亂鬥｜年級學期大廳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #1d1260; --panel: #2c2a8f; --panel-2: #3d3bb5; --edge: #0a0626;
  --ink: #fff; --dim: #c4c1ff; --gold: #ffd400; --good: #3be06a; --oops: #ff4d6d;
  --font-display: "Chiron GoRound TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg);
  background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 28px, transparent 28px 56px),
                    radial-gradient(circle at 50% 0, #4b2bd6, transparent 70%);
  color: var(--ink); font-family: var(--font-body); font-weight: 700;
  display: grid; place-items: center; padding: 20px;
}
.wrap { width: min(720px, 100%); display: grid; gap: 18px; text-align: center; }
h1 {
  font-family: var(--font-display); font-size: clamp(32px, 7vw, 48px);
  color: var(--gold); font-style: italic; font-weight: 900; margin: 0;
  -webkit-text-stroke: 4px var(--edge); paint-order: stroke fill;
  text-shadow: 0 5px 0 var(--edge);
}
.sub { color: var(--dim); font-size: 16px; margin: 4px 0 0; }

/* 學期切換分頁標籤 */
.tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.tab-btn {
  font-family: var(--font-display); font-size: 17px; padding: 10px 18px;
  border-radius: 14px; border: 3px solid var(--edge); color: var(--ink); cursor: pointer;
  background: linear-gradient(#6aa8ff, #2f6be0); box-shadow: 0 5px 0 #123a8a;
  text-shadow: -1.5px 0 var(--edge), 1.5px 0 var(--edge), 0 -1.5px var(--edge), 0 1.5px var(--edge);
  transition: transform .1s;
}
.tab-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #123a8a; }
.tab-btn[aria-pressed="true"] {
  background: linear-gradient(#ffe14d, #ffb800); box-shadow: 0 5px 0 #8a5a00;
}

.panel {
  background: var(--panel); border: 4px solid var(--edge);
  border-radius: 18px; box-shadow: 0 6px 0 var(--edge);
  padding: 20px 18px; display: grid; gap: 14px;
}
.term-header {
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 3px dashed rgba(255,255,255,.15); padding-bottom: 10px;
}
.term-title { font-family: var(--font-display); font-size: 20px; color: var(--gold); }
.term-tag { font-size: 13px; background: var(--edge); padding: 4px 10px; border-radius: 10px; color: var(--dim); }

.grid { display: grid; gap: 12px; }
.grid[hidden] { display: none; }

.card {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--panel-2); border: 3px solid var(--edge);
  border-radius: 16px; padding: 14px 18px; text-decoration: none; color: var(--ink);
  box-shadow: 0 5px 0 var(--edge); transition: transform .1s;
}
.card:hover:not(.soon) { filter: brightness(1.12); transform: translateY(-2px); }
.card:active:not(.soon) { transform: translateY(3px); box-shadow: 0 2px 0 var(--edge); }
.card.soon { opacity: 0.65; cursor: not-allowed; }
.info { display: flex; align-items: center; gap: 14px; text-align: left; }
.ico { font-size: 40px; line-height: 1; }
.title { font-family: var(--font-display); font-size: 21px; color: var(--gold); text-shadow: 2px 2px 0 var(--edge); }
.desc { font-size: 14px; color: var(--dim); margin-top: 3px; }
.badge {
  font-family: var(--font-display); font-size: 15px; padding: 8px 14px;
  border-radius: 12px; border: 3px solid var(--edge); white-space: nowrap;
  text-shadow: -1.5px 0 var(--edge), 1.5px 0 var(--edge), 0 -1.5px var(--edge), 0 1.5px var(--edge);
}
.go { background: linear-gradient(#6bf06b, #2dbd2d); box-shadow: 0 4px 0 #0f6a0f; }
.lock { background: #666; box-shadow: 0 4px 0 #333; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>⚔️ 知識大亂鬥</h1>
    <p class="sub">選擇年級與學期，進入對應礦坑挑戰終界龍！</p>
  </div>

  <!-- 年級／學期切換按鈕 -->
  <div class="tabs" role="tablist">
    <button class="tab-btn" data-term="g5-s1" aria-pressed="true">📘 五年級上學期</button>
    <button class="tab-btn" data-term="g5-s2" aria-pressed="false">📗 五年級下學期</button>
    <button class="tab-btn" data-term="g6-s1" aria-pressed="false">📙 六年級上學期</button>
  </div>

  <div class="panel">
    <div class="term-header">
      <span class="term-title" id="term-label">📘 五年級上學期（G5-S1）</span>
      <span class="term-tag">康軒版課綱</span>
    </div>

    <!-- ================= 五年級上學期 (g5-s1) ================= -->
    <div class="grid" id="grid-g5-s1">
      <a class="card" href="g5_s1_science.html">
        <div class="info">
          <div class="ico">🧪</div>
          <div>
            <div class="title">自然大亂鬥（水溶液篇）</div>
            <div class="desc">第三單元：溶解現象、酸鹼指示劑與導電性</div>
          </div>
        </div>
        <span class="badge go">開始挖礦 ▶</span>
      </a>

      <a class="card" href="g5_s1_history.html">
        <div class="info">
          <div class="ico">📜</div>
          <div>
            <div class="title">社會／歷史大亂鬥</div>
            <div class="desc">臺灣位置、離島、社會規範、法律與地形氣候</div>
          </div>
        </div>
        <span class="badge go">開始挖礦 ▶</span>
      </a>

      <a class="card soon" href="g5_s1_math.html" onclick="return checkSoon(this)">
        <div class="info">
          <div class="ico">📐</div>
          <div>
            <div class="title">數學大亂鬥</div>
            <div class="desc">因數與倍數、擴分約分與多邊形面積</div>
          </div>
        </div>
        <span class="badge lock">建置中 🔒</span>
      </a>
    </div>

    <!-- ================= 五年級下學期 (g5-s2) ================= -->
    <div class="grid" id="grid-g5-s2" hidden>
      <a class="card soon" href="g5_s2_science.html" onclick="return checkSoon(this)">
        <div class="info">
          <div class="ico">🦁</div>
          <div>
            <div class="title">自然大亂鬥（動物與生態）</div>
            <div class="desc">動物的運動、覓食防衛與生殖育幼行為</div>
          </div>
        </div>
        <span class="badge lock">建置中 🔒</span>
      </a>

      <a class="card soon" href="g5_s2_history.html" onclick="return checkSoon(this)">
        <div class="info">
          <div class="ico">🏯</div>
          <div>
            <div class="title">社會／歷史大亂鬥</div>
            <div class="desc">清領時期的開港通商與現代化建設</div>
          </div>
        </div>
        <span class="badge lock">建置中 🔒</span>
      </a>
    </div>

    <!-- ================= 六年級上學期 (g6-s1) ================= -->
    <div class="grid" id="grid-g6-s1" hidden>
      <a class="card soon" href="g6_s1_science.html" onclick="return checkSoon(this)">
        <div class="info">
          <div class="ico">🌋</div>
          <div>
            <div class="title">自然大亂鬥（地質與天氣）</div>
            <div class="desc">岩石礦物、地震防災與大氣變化</div>
          </div>
        </div>
        <span class="badge lock">未來解鎖 🔒</span>
      </a>
    </div>
  </div>
</div>

<script>
const labels = {
  'g5-s1': '📘 五年級上學期（G5-S1）',
  'g5-s2': '📗 五年級下學期（G5-S2）',
  'g6-s1': '📙 六年級上學期（G6-S1）'
};

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.term;
    document.querySelectorAll('.tab-btn').forEach(b => b.setAttribute('aria-pressed', b === btn));
    document.querySelectorAll('.grid').forEach(g => g.hidden = (g.id !== 'grid-' + target));
    document.getElementById('term-label').textContent = labels[target];
  });
});

function checkSoon(el) {
  if (el.classList.contains('soon')) {
    alert('這個年級學期的礦坑還在施工中，敬請期待！');
    return false;
  }
  return true;
}
</script>
</body>
</html>
